[theme]
primaryColor = "#10a37f"
backgroundColor = "#0f172a"
secondaryBackgroundColor = "#1e293b"
textColor = "#ffffff"
font = "sans serif"

[server]
enableCORS = false
enableXsrfProtection = false
enableStaticServing = true
port = 8501
headless = true

[browser]
# This prevents the UI from trying to collect stats, making it snappier
gatherUsageStats = false